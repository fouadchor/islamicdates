# Rebuilds the live site on a schedule.
#
# Much of the site is decided at build time, not at request time:
#   - which pages are indexable (converter, month grids, occasions, Hijri year
#     pages, and the imsakiyah window that opens 100 days before Ramadan),
#   - the monthly prayer-times table that crawlers see on every city page,
#   - the homepage occasion chips and countdowns.
# Without a rebuild those stay frozen at the date of the last merged PR.
#
# How it rebuilds — no setup needed:
#   The job writes the current time to .github/last-scheduled-rebuild and
#   pushes that one-line change to main. Cloudflare Pages builds every push to
#   main (build watch path is "*"), exactly as it does after a merge. Nothing in
#   the site reads that file. A side effect is useful: the commit keeps the repo
#   active, so GitHub never pauses this schedule for inactivity.
#
# Optional: if a repository secret CF_PAGES_DEPLOY_HOOK is ever added
# (Cloudflare → Workers & Pages → islamicdates → Settings → Builds → Deploy
# hooks), the job calls that hook instead and makes no commit.
#
# Times are UTC. 12:07 UTC is past midnight in every city the site covers, so
# the run on the 1st already sees the new month everywhere.

name: Scheduled rebuild

on:
  schedule:
    - cron: '7 12 1 * *'   # the 1st of every month — new prayer-times month
    - cron: '7 12 * * 0'   # every Sunday — date windows and countdowns roll
  workflow_dispatch:       # "Run workflow" button for a manual rebuild

permissions:
  contents: write

concurrency:
  group: scheduled-rebuild
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Rebuild through the deploy hook, if one is configured
        id: hook
        env:
          HOOK: ${{ secrets.CF_PAGES_DEPLOY_HOOK }}
        run: |
          if [ -n "$HOOK" ]; then
            curl --fail --silent --show-error --retry 3 --retry-delay 10 -X POST "$HOOK" > /dev/null
            echo "Deploy hook called; Cloudflare is building main."
            echo "done=true" >> "$GITHUB_OUTPUT"
          else
            echo "No deploy hook secret; rebuilding with a stamp commit instead."
          fi

      - name: Check out main
        if: steps.hook.outputs.done != 'true'
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Push a stamp commit to main (Cloudflare builds it)
        if: steps.hook.outputs.done != 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # If a PR lands on main between fetch and push, start again from the new tip.
          for attempt in 1 2 3; do
            git fetch --depth=1 origin main
            git reset --quiet --hard FETCH_HEAD
            date -u +%Y-%m-%dT%H:%M:%SZ > .github/last-scheduled-rebuild
            git add .github/last-scheduled-rebuild
            git commit --quiet -m "Scheduled rebuild $(date -u +%F)"
            git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
