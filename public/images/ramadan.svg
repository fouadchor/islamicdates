  <circle cx="890" cy="434" r="58"/>
  <rect x="1020" y="348" width="12" height="86"/><circle cx="1026" cy="346" r="8"/><path d="M1019,341 L1026,325 L1033,341 Z"/>
  <circle cx="1130" cy="438" r="44"/>
