  <rect x="-24" y="160" width="48" height="98" rx="10" fill="#fff3cf"/>
  <path d="M-24,209 L0,160 L24,209 L0,258 Z" fill="none" stroke="#e4b654" stroke-width="2"/>
  <path d="M-30,268 L30,268 L22,282 L-22,282 Z" fill="url(#gold)"/>
  <circle cx="0" cy="290" r="6" fill="url(#gold)"/>
</g>
