  <circle cx="640" cy="60" r="2.4" opacity=".7"/>
  <circle cx="800" cy="40" r="2" opacity=".5"/>
  <circle cx="1060" cy="330" r="2.4" opacity=".55"/>
  <circle cx="220" cy="250" r="2" opacity=".4"/>
</g>
