<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" role="img" aria-labelledby="rt rd">
<title id="rt">رمضان — فانوس وهلال فوق المآذن</title>
<desc id="rd">رسم توضيحي لشهر رمضان المبارك: فانوس مضيء وهلال ذهبي في سماء الليل فوق صورة ظلية لمساجد ومآذن.</desc>
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#11544c"/><stop offset="1" stop-color="#06251f"/>
  </linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#f7d98d"/><stop offset="1" stop-color="#d9a441"/>
  </linearGradient>
  <radialGradient id="glow">
    <stop offset="0" stop-color="#fbe4a3" stop-opacity=".38"/><stop offset="1" stop-color="#fbe4a3" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="lglow">
    <stop offset="0" stop-color="#ffd97a" stop-opacity=".45"/><stop offset="1" stop-color="#ffd97a" stop-opacity="0"/>
  </radialGradient>
  <path id="sp" d="M0,-7 Q1.8,-1.8 7,0 Q1.8,1.8 0,7 Q-1.8,1.8 -7,0 Q-1.8,-1.8 0,-7 Z"/>
  <pattern id="geo" width="96" height="96" patternUnits="userSpaceOnUse">
    <g fill="none" stroke="#5eead4" stroke-opacity=".07" stroke-width="1.4">
      <rect x="28" y="28" width="40" height="40"/>
      <rect x="28" y="28" width="40" height="40" transform="rotate(45 48 48)"/>
    </g>
  </pattern>
</defs>
<rect width="1200" height="480" fill="url(#sky)"/>
<rect width="1200" height="480" fill="url(#geo)"/>
<!-- crescent -->
<circle cx="958" cy="182" r="190" fill="url(#glow)"/>
<path d="M0,-14 A14,14 0 1 0 9,10 A11,11 0 1 1 0,-14 Z" transform="translate(958 182) rotate(-25) scale(7.4)" fill="url(#gold)"/>
<!-- stars -->
<g fill="#ffe9b8">
  <use href="#sp" x="140" y="70" opacity=".9"/>
  <use href="#sp" x="480" y="52" opacity=".55" transform="scale(.8)"/>
  <use href="#sp" x="700" y="120" opacity=".8"/>
  <use href="#sp" x="1120" y="70" opacity=".6"/>
  <use href="#sp" x="560" y="210" opacity=".45"/>
