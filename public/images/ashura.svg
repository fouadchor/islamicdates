<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" role="img" aria-labelledby="st sd">
<title id="st">عاشوراء — عشر ليالٍ من محرم</title>
<desc id="sd">رسم توضيحي ليوم عاشوراء: أطوار القمر العشرة الأولى من شهر محرم تنتهي ببدر مضيء يرمز لليوم العاشر.</desc>
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#0f4a43"/><stop offset="1" stop-color="#052420"/>
  </linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#f7d98d"/><stop offset="1" stop-color="#d9a441"/>
  </linearGradient>
  <radialGradient id="glow">
    <stop offset="0" stop-color="#fbe4a3" stop-opacity=".45"/><stop offset="1" stop-color="#fbe4a3" stop-opacity="0"/>
  </radialGradient>
  <path id="sp" d="M0,-7 Q1.8,-1.8 7,0 Q1.8,1.8 0,7 Q-1.8,1.8 -7,0 Q-1.8,-1.8 0,-7 Z"/>
  <pattern id="geo" width="96" height="96" patternUnits="userSpaceOnUse">
    <g fill="none" stroke="#5eead4" stroke-opacity=".07" stroke-width="1.4">
      <rect x="28" y="28" width="40" height="40"/>
      <rect x="28" y="28" width="40" height="40" transform="rotate(45 48 48)"/>
    </g>
  </pattern>
  <clipPath id="m1"><circle cx="0" cy="0" r="20"/></clipPath>
</defs>
<rect width="1200" height="480" fill="url(#sky)"/>
<rect width="1200" height="480" fill="url(#geo)"/>
<!-- the 10th moon, full and radiant -->
<circle cx="920" cy="210" r="200" fill="url(#glow)"/>
<circle cx="920" cy="210" r="96" fill="url(#gold)"/>
<circle cx="920" cy="210" r="118" fill="none" stroke="#ffe9ad" stroke-opacity=".25" stroke-width="2"/>
<circle cx="892" cy="182" r="12" fill="#fff" opacity=".25"/>
<circle cx="946" cy="236" r="8" fill="#c99b45" opacity=".3"/>
<!-- moon phases 1..9 arcing toward it -->
<g fill="#f2dfae">
  <g transform="translate(120,330)" clip-path="url(#m1)"><circle r="20" opacity=".2"/><circle cx="-13" r="20" fill="#0a3630"/></g>
  <g transform="translate(205,290)" clip-path="url(#m1)"><circle r="20" opacity=".35"/><circle cx="-15" r="20" fill="#0a3630"/></g>
  <g transform="translate(292,254)" clip-path="url(#m1)"><circle r="20" opacity=".45"/><circle cx="-17" r="20" fill="#0a3630"/></g>
  <g transform="translate(382,224)" clip-path="url(#m1)"><circle r="20" opacity=".55"/><circle cx="-20" r="20" fill="#0a3630"/></g>
  <g transform="translate(474,200)" clip-path="url(#m1)"><circle r="20" opacity=".65"/><circle cx="-24" r="20" fill="#0a3630"/></g>
  <g transform="translate(568,184)" clip-path="url(#m1)"><circle r="20" opacity=".75"/><circle cx="-29" r="20" fill="#0a3630"/></g>
  <g transform="translate(662,176)" clip-path="url(#m1)"><circle r="20" opacity=".85"/><circle cx="-34" r="20" fill="#0a3630"/></g>
  <g transform="translate(756,178)" clip-path="url(#m1)"><circle r="20" opacity=".92"/><circle cx="-40" r="20" fill="#0a3630"/></g>
  <circle cx="836" cy="188" r="10" opacity=".95"/>
</g>
<!-- stars -->
<g fill="#ffe9b8">
  <use href="#sp" x="160" y="100" opacity=".7"/>
  <use href="#sp" x="420" y="70" opacity=".55"/>
  <use href="#sp" x="660" y="60" opacity=".65"/>
  <use href="#sp" x="1120" y="120" opacity=".5"/>
  <circle cx="300" cy="140" r="2.2" opacity=".5"/>
  <circle cx="540" cy="130" r="2" opacity=".45"/>
  <circle cx="760" cy="90" r="2.4" opacity=".55"/>
  <circle cx="1060" cy="330" r="2" opacity=".4"/>
</g>
<!-- skyline -->
<g fill="#04201b">
  <rect y="434" width="1200" height="46"/>
  <circle cx="200" cy="438" r="48"/>
  <rect x="330" y="344" width="13" height="92"/><circle cx="336" cy="342" r="9"/><path d="M328,336 L336,318 L344,336 Z"/>
  <circle cx="500" cy="440" r="42"/>
  <rect x="640" y="356" width="12" height="80"/><circle cx="646" cy="354" r="8"/><path d="M639,349 L646,333 L653,349 Z"/>
  <circle cx="800" cy="438" r="50"/>
  <rect x="950" y="340" width="14" height="96"/><circle cx="957" cy="338" r="9"/><path d="M949,332 L957,314 L965,332 Z"/>
  <circle cx="1110" cy="440" r="46"/>
</g>
</svg>
