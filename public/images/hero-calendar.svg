<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="ht hd">
<title id="ht">التقويم الهجري — هلال وتقويم شهري</title>
<desc id="hd">رسم توضيحي للتقويم الهجري: بطاقة تقويم شهري بيوم مميّز بجانب هلال ذهبي ونجوم على خلفية زخرفية إسلامية.</desc>
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#11544c"/><stop offset="1" stop-color="#07302a"/>
  </linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#f7d98d"/><stop offset="1" stop-color="#d9a441"/>
  </linearGradient>
  <radialGradient id="glow">
    <stop offset="0" stop-color="#fbe4a3" stop-opacity=".38"/><stop offset="1" stop-color="#fbe4a3" stop-opacity="0"/>
  </radialGradient>
  <path id="sp" d="M0,-7 Q1.8,-1.8 7,0 Q1.8,1.8 0,7 Q-1.8,1.8 -7,0 Q-1.8,-1.8 0,-7 Z"/>
  <pattern id="geo" width="96" height="96" patternUnits="userSpaceOnUse">
    <g fill="none" stroke="#5eead4" stroke-opacity=".08" stroke-width="1.4">
      <rect x="28" y="28" width="40" height="40"/>
      <rect x="28" y="28" width="40" height="40" transform="rotate(45 48 48)"/>
    </g>
  </pattern>
</defs>
<rect width="1200" height="420" fill="url(#sky)"/>
<rect width="1200" height="420" fill="url(#geo)"/>
<!-- crescent -->
<circle cx="330" cy="150" r="185" fill="url(#glow)"/>
<path d="M0,-14 A14,14 0 1 0 9,10 A11,11 0 1 1 0,-14 Z" transform="translate(330 150) rotate(-25) scale(7.1)" fill="url(#gold)"/>
<!-- stars -->
<g fill="#ffe9b8">
  <use href="#sp" x="120" y="80" opacity=".8"/>
  <use href="#sp" x="540" y="60" opacity=".6"/>
  <use href="#sp" x="480" y="290" opacity=".5"/>
  <use href="#sp" x="1140" y="60" opacity=".6"/>
  <circle cx="80" cy="230" r="2.4" opacity=".55"/>
  <circle cx="440" cy="150" r="2" opacity=".5"/>
  <circle cx="600" cy="200" r="2.2" opacity=".45"/>
  <circle cx="180" cy="330" r="2" opacity=".4"/>
</g>
<!-- calendar card -->
<g transform="translate(700,60)">
  <rect x="8" y="12" width="420" height="310" rx="20" fill="#032019" opacity=".55"/>
  <rect x="0" y="0" width="420" height="310" rx="20" fill="#f6fbf9"/>
  <rect x="0" y="0" width="420" height="66" rx="20" fill="#0d9488"/>
  <rect x="0" y="40" width="420" height="26" fill="#0d9488"/>
  <!-- header crescent + bars -->
  <path d="M52,33 A17,17 0 1 0 63,10 A13.5,13.5 0 1 1 52,33 Z" fill="#fff3cf" transform="rotate(-25 55 25)"/>
  <rect x="120" y="24" width="180" height="10" rx="5" fill="#8ff0dc"/>
  <rect x="120" y="42" width="110" height="8" rx="4" fill="#5ec9b8"/>
  <!-- weekday dots row -->
  <g fill="#9fb9b2">
    <rect x="36" y="88" width="30" height="8" rx="4"/><rect x="90" y="88" width="30" height="8" rx="4"/>
    <rect x="144" y="88" width="30" height="8" rx="4"/><rect x="198" y="88" width="30" height="8" rx="4"/>
    <rect x="252" y="88" width="30" height="8" rx="4"/><rect x="306" y="88" width="30" height="8" rx="4"/>
    <rect x="360" y="88" width="30" height="8" rx="4"/>
  </g>
  <!-- day grid 7x4 -->
  <g fill="#cfe4dd">
    <circle cx="51" cy="130" r="13"/><circle cx="105" cy="130" r="13"/><circle cx="159" cy="130" r="13"/><circle cx="213" cy="130" r="13"/><circle cx="267" cy="130" r="13"/><circle cx="321" cy="130" r="13"/><circle cx="375" cy="130" r="13"/>
    <circle cx="51" cy="178" r="13"/><circle cx="105" cy="178" r="13"/><circle cx="159" cy="178" r="13"/><circle cx="267" cy="178" r="13"/><circle cx="321" cy="178" r="13"/><circle cx="375" cy="178" r="13"/>
    <circle cx="51" cy="226" r="13"/><circle cx="105" cy="226" r="13"/><circle cx="159" cy="226" r="13"/><circle cx="213" cy="226" r="13"/><circle cx="267" cy="226" r="13"/><circle cx="321" cy="226" r="13"/><circle cx="375" cy="226" r="13"/>
    <circle cx="51" cy="274" r="13"/><circle cx="105" cy="274" r="13"/><circle cx="159" cy="274" r="13"/><circle cx="213" cy="274" r="13"/><circle cx="267" cy="274" r="13"/>
  </g>
  <!-- today highlighted -->
  <circle cx="213" cy="178" r="20" fill="#0d9488"/>
  <circle cx="213" cy="178" r="26" fill="none" stroke="#0d9488" stroke-opacity=".4" stroke-width="3"/>
  <!-- eid day in gold -->
  <circle cx="321" cy="274" r="14" fill="url(#gold)"/>
</g>
<!-- connecting sparkle between crescent and card -->
<use href="#sp" x="640" y="140" fill="#ffe9b8" opacity=".7"/>
<!-- ground line -->
<path d="M0,420 L0,392 Q300,372 620,392 Q920,410 1200,390 L1200,420 Z" fill="#05231e"/>
</svg>
