<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 130" role="img" aria-labelledby="ot od">
<title id="ot">زخرفة قوس إسلامي</title>
<desc id="od">زخرفة علوية على شكل قوس مسجد مع هلال صغير ونجوم، تُستخدم لتزيين قسم حديث اليوم.</desc>
<defs>
  <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#f7d98d"/><stop offset="1" stop-color="#d9a441"/>
  </linearGradient>
  <path id="sp" d="M0,-6 Q1.5,-1.5 6,0 Q1.5,1.5 0,6 Q-1.5,1.5 -6,0 Q-1.5,-1.5 0,-6 Z"/>
</defs>
<!-- mihrab arch -->
<path d="M330,130 L330,96 Q330,44 450,30 Q570,44 570,96 L570,130"
  fill="none" stroke="#0d9488" stroke-width="3" stroke-opacity=".7"/>
<path d="M354,130 L354,100 Q354,58 450,46 Q546,58 546,100 L546,130"
  fill="none" stroke="#0d9488" stroke-width="1.6" stroke-opacity=".35"/>
<!-- crescent at apex -->
<g transform="translate(450,16)">
  <path d="M0,-14 A14,14 0 1 0 9,10 A11,11 0 1 1 0,-14 Z" fill="url(#gold)" transform="rotate(-20)"/>
</g>
<!-- side flourishes -->
<g fill="none" stroke="#0d9488" stroke-width="2" stroke-linecap="round" stroke-opacity=".55">
  <path d="M300,112 Q250,112 226,86 Q206,64 170,68"/>
  <path d="M600,112 Q650,112 674,86 Q694,64 730,68"/>
  <path d="M170,68 Q150,70 142,84" />
  <path d="M730,68 Q750,70 758,84" />
</g>
<g fill="#d9a441">
  <circle cx="142" cy="88" r="4"/>
  <circle cx="758" cy="88" r="4"/>
  <use href="#sp" x="250" y="60" opacity=".8"/>
  <use href="#sp" x="650" y="60" opacity=".8"/>
  <circle cx="330" cy="40" r="2.4" opacity=".7"/>
  <circle cx="570" cy="40" r="2.4" opacity=".7"/>
</g>
</svg>
