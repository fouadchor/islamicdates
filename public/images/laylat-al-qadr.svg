<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" role="img" aria-labelledby="qt qd">
<title id="qt">ليلة القدر — سماء متلألئة ونور ساطع</title>
<desc id="qd">رسم توضيحي لليلة القدر: بدر منير تتنزّل منه أشعة النور في سماء مرصّعة بالنجوم فوق صورة ظلية لمسجد.</desc>
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#0d3a4a"/><stop offset="1" stop-color="#051e24"/>
  </linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fdeebc"/><stop offset="1" stop-color="#e3b45a"/>
  </linearGradient>
  <radialGradient id="halo">
    <stop offset="0" stop-color="#ffe9ad" stop-opacity=".5"/><stop offset="1" stop-color="#ffe9ad" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="ray" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffe9ad" stop-opacity=".32"/><stop offset="1" stop-color="#ffe9ad" stop-opacity="0"/>
  </linearGradient>
  <path id="sp" d="M0,-7 Q1.8,-1.8 7,0 Q1.8,1.8 0,7 Q-1.8,1.8 -7,0 Q-1.8,-1.8 0,-7 Z"/>
  <pattern id="geo" width="96" height="96" patternUnits="userSpaceOnUse">
    <g fill="none" stroke="#5eead4" stroke-opacity=".06" stroke-width="1.4">
      <rect x="28" y="28" width="40" height="40"/>
      <rect x="28" y="28" width="40" height="40" transform="rotate(45 48 48)"/>
    </g>
  </pattern>
</defs>
<rect width="1200" height="480" fill="url(#sky)"/>
<rect width="1200" height="480" fill="url(#geo)"/>
<!-- descending light -->
<path d="M780,150 L560,480 L1080,480 Z" fill="url(#ray)"/>
<!-- radiant moon -->
<circle cx="820" cy="150" r="230" fill="url(#halo)"/>
<circle cx="820" cy="150" r="118" fill="none" stroke="#ffe9ad" stroke-opacity=".22" stroke-width="2"/>
<circle cx="820" cy="150" r="145" fill="none" stroke="#ffe9ad" stroke-opacity=".12" stroke-width="2"/>
<circle cx="820" cy="150" r="86" fill="url(#gold)"/>
<circle cx="790" cy="120" r="14" fill="#fff" opacity=".28"/>
<circle cx="850" cy="170" r="9" fill="#c99b45" opacity=".28"/>
<circle cx="800" cy="180" r="6" fill="#c99b45" opacity=".22"/>
<!-- stars -->
<g fill="#ffefc4">
  <use href="#sp" x="120" y="90" opacity=".9"/>
  <use href="#sp" x="300" y="180" opacity=".6"/>
  <use href="#sp" x="470" y="70" opacity=".85"/>
  <use href="#sp" x="600" y="250" opacity=".5"/>
  <use href="#sp" x="1080" y="110" opacity=".8"/>
  <use href="#sp" x="1140" y="290" opacity=".5"/>
  <use href="#sp" x="210" y="300" opacity=".45"/>
  <circle cx="70" cy="220" r="2.4" opacity=".6"/>
  <circle cx="390" cy="120" r="2" opacity=".55"/>
  <circle cx="540" cy="160" r="2.6" opacity=".7"/>
  <circle cx="660" cy="60" r="2" opacity=".5"/>
  <circle cx="980" cy="60" r="2.4" opacity=".6"/>
  <circle cx="1040" cy="210" r="2" opacity=".5"/>
  <circle cx="160" cy="380" r="2" opacity=".35"/>
  <circle cx="440" cy="330" r="2.2" opacity=".4"/>
</g>
<!-- skyline -->
<g fill="#04191c">
  <rect y="436" width="1200" height="44"/>
  <circle cx="240" cy="440" r="52"/>
  <rect x="360" y="336" width="14" height="102"/><circle cx="367" cy="334" r="9"/><path d="M359,328 L367,310 L375,328 Z"/>
  <circle cx="520" cy="442" r="44"/>
  <rect x="640" y="360" width="12" height="78"/><circle cx="646" cy="358" r="8"/><path d="M639,353 L646,337 L653,353 Z"/>
  <circle cx="820" cy="438" r="60"/>
  <rect x="960" y="330" width="15" height="108"/><circle cx="967" cy="328" r="10"/><path d="M958,321 L967,301 L976,321 Z"/>
  <circle cx="1100" cy="442" r="46"/>
</g>
</svg>
