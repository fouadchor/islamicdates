<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" role="img" aria-labelledby="art ard">
<title id="art">يوم عرفة — جبل الرحمة عند الغروب</title>
<desc id="ard">رسم توضيحي ليوم عرفة: جبل الرحمة بشاخصه الأبيض تحت شمس منخفضة عند الأصيل في يوم الوقوف بعرفة.</desc>
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#177066"/><stop offset=".55" stop-color="#0e4a42"/><stop offset="1" stop-color="#093630"/>
  </linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fce3a0"/><stop offset="1" stop-color="#e0ac47"/>
  </linearGradient>
  <radialGradient id="sun">
    <stop offset="0" stop-color="#ffe9ad" stop-opacity=".55"/><stop offset="1" stop-color="#ffe9ad" stop-opacity="0"/>
  </radialGradient>
  <path id="sp" d="M0,-7 Q1.8,-1.8 7,0 Q1.8,1.8 0,7 Q-1.8,1.8 -7,0 Q-1.8,-1.8 0,-7 Z"/>
  <pattern id="geo" width="96" height="96" patternUnits="userSpaceOnUse">
    <g fill="none" stroke="#5eead4" stroke-opacity=".06" stroke-width="1.4">
      <rect x="28" y="28" width="40" height="40"/>
      <rect x="28" y="28" width="40" height="40" transform="rotate(45 48 48)"/>
    </g>
  </pattern>
</defs>
<rect width="1200" height="480" fill="url(#sky)"/>
<rect width="1200" height="480" fill="url(#geo)"/>
<!-- low sun -->
<circle cx="330" cy="330" r="230" fill="url(#sun)"/>
<circle cx="330" cy="330" r="72" fill="url(#gold)"/>
<g stroke="#ffe9ad" stroke-opacity=".35" stroke-width="2.5" stroke-linecap="round">
  <line x1="330" y1="212" x2="330" y2="184"/>
  <line x1="416" y1="248" x2="436" y2="228"/>
  <line x1="244" y1="248" x2="224" y2="228"/>
  <line x1="452" y1="330" x2="480" y2="330"/>
  <line x1="208" y1="330" x2="180" y2="330"/>
</g>
<!-- faint day stars -->
<g fill="#ffefc4">
  <use href="#sp" x="700" y="80" opacity=".45"/>
  <use href="#sp" x="980" y="140" opacity=".5"/>
  <circle cx="850" cy="70" r="2" opacity=".4"/>
  <circle cx="1120" cy="90" r="2.2" opacity=".4"/>
</g>
<!-- far hills -->
<path d="M0,480 L0,410 Q170,352 360,404 Q560,452 700,398 Q900,338 1200,402 L1200,480 Z" fill="#0c4038"/>
<!-- Jabal al-Rahmah -->
<path d="M480,480 Q640,472 730,404 Q800,352 862,332 Q930,352 1000,410 Q1090,470 1200,480 Z" fill="#083029"/>
<!-- white pillar on summit -->
<rect x="855" y="284" width="13" height="52" rx="2" fill="#eef7f4"/>
<rect x="849" y="330" width="25" height="10" rx="2" fill="#d8e8e3"/>
<!-- path up the mount -->
<path d="M700,470 Q760,430 810,392 Q840,368 858,340" fill="none" stroke="#5eead4" stroke-opacity=".4" stroke-width="2.5" stroke-dasharray="2 12" stroke-linecap="round"/>
<!-- foreground -->
<path d="M0,480 L0,452 Q240,426 520,452 Q820,478 1200,450 L1200,480 Z" fill="#052620"/>
</svg>
