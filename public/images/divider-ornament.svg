<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 70" role="img" aria-labelledby="dt dd">
<title id="dt">فاصل زخرفي إسلامي</title>
<desc id="dd">فاصل زخرفي بنجمة ثمانية إسلامية وخطوط رفيعة تنتهي بمعيّنات.</desc>
<defs>
  <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#f7d98d"/><stop offset="1" stop-color="#d9a441"/>
  </linearGradient>
</defs>
<g stroke="#0d9488" stroke-width="1.6">
  <line x1="80" y1="35" x2="500" y2="35" stroke-opacity=".45"/>
  <line x1="700" y1="35" x2="1120" y2="35" stroke-opacity=".45"/>
</g>
<g fill="#0d9488">
  <path d="M80,35 L68,27 L56,35 L68,43 Z" opacity=".7"/>
  <path d="M1120,35 L1132,27 L1144,35 L1132,43 Z" opacity=".7"/>
  <circle cx="530" cy="35" r="3.4" opacity=".55"/>
  <circle cx="670" cy="35" r="3.4" opacity=".55"/>
</g>
<!-- central 8-point star -->
<g transform="translate(600,35)">
  <g fill="none" stroke="#0d9488" stroke-width="2">
    <rect x="-15" y="-15" width="30" height="30"/>
    <rect x="-15" y="-15" width="30" height="30" transform="rotate(45)"/>
  </g>
  <circle r="5" fill="#d9a441"/>
</g>
</svg>
